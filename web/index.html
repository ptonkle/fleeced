<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Reference default. connect-src 'self' keeps fetches on this origin,
       and the relays are exactly those in web/net/config.js (kits/online;
       online_fence.rs matches the two);
       'wasm-unsafe-eval' lets the page compile its own WebAssembly module;
       form-action 'none' blocks form posts. A meta policy cannot stop data
       leaving by navigation, so the browser check still watches requests.
       img-src data: lets the core's tab icon through. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss://nos.lol wss://relay.ditto.pub wss://purplerelay.com wss://nostr.data.haus wss://relay.primal.net; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Fleeced</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hud.css">
  <!-- The core makes the tab icon; the empty data URL keeps the browser from
       asking for a favicon file before the page sets it. -->
  <link id="tab-icon" rel="icon" href="data:,">
</head>
<body data-ready="false">
  <!-- Dog mode: red and green fold into one axis, as in a dog's two-cone
       sight. Applied over the whole page, menus and game alike (style.css,
       body[data-dog]). The numbers are a published dichromat matrix. -->
  <svg class="defs" aria-hidden="true" width="0" height="0">
    <filter id="dog-vision" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="0.367 0.861 -0.228 0 0  0.280 0.673 0.047 0 0  -0.012 0.043 0.969 0 0  0 0 0 1 0"/>
    </filter>
  </svg>
  <!-- The one full-window 3D view (web/gl.js, web/backdrop.js): the hillside
       behind the menus, with the lobby's lineup of every seat's character
       between the docked panels. -->
  <canvas id="view" aria-hidden="true"></canvas>
  <main id="menus"></main>
  <p id="message" role="status"></p>
  <button id="version" type="button"></button>
  <noscript><p>This page needs JavaScript and WebAssembly.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
