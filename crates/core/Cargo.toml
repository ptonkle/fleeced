[package]
name = "tool_core"
version = "0.1.0"
edition = "2021"
description = "Every application rule of the tool. No input or output."
publish = false

# The allowlist for this crate is ALLOWED_DEPENDENCIES in tests/boundary.rs.
# Adding a dependency here without adding it there fails `cargo test`.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Timed under wasm by scripts/bench_wasm.mjs. Built by nothing else.
[[example]]
name = "wasm_bench"
crate-type = ["cdylib"]

[[example]]
name = "wasm_match"
crate-type = ["cdylib"]
